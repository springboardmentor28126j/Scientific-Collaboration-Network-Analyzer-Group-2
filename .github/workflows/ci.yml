name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scna_user
          POSTGRES_PASSWORD: scna_password
          POSTGRES_DB: scna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r app/requirements-dev.txt

      - name: Lint with ruff
        working-directory: backend
        run: ruff check .

      - name: Run Alembic migrations against test DB
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://scna_user:scna_password@localhost:5432/scna_test
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://scna_user:scna_password@localhost:5432/scna_test
          JWT_SECRET_KEY: ci-test-secret-key
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t scna-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t scna-frontend:ci ./frontend