name: Build, Push & Deploy (SCNA)

# Builds the backend and frontend Docker images, pushes them to GitHub
# Container Registry (GHCR), then triggers a redeploy on Render for each
# service via its deploy hook. No tests/linting yet -- build-only CI for now.

on:
  push:
    branches: [Vishal_Kumar]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/<repo>-backend and -frontend, all lowercase (GHCR requires
  # lowercase image names; github.repository is usually already lowercase but
  # we lowercase it defensively in case the repo/org name has capitals).
  IMAGE_BASE: ${{ github.repository }}

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image base
        id: vars
        run: echo "image_base=$(echo '${{ env.IMAGE_BASE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_base }}-backend:latest
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_base }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image base
        id: vars
        run: echo "image_base=$(echo '${{ env.IMAGE_BASE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_base }}-frontend:latest
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_base }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy - backend
        run: |
          if [ -z "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            echo "RENDER_BACKEND_DEPLOY_HOOK secret is not set -- skipping backend deploy trigger."
          else
            curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
          fi

      - name: Trigger Render deploy - frontend
        run: |
          if [ -z "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" ]; then
            echo "RENDER_FRONTEND_DEPLOY_HOOK secret is not set -- skipping frontend deploy trigger."
          else
            curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
          fi
