services:
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: research_db_test
    ports:
      - "5433:5432"  # different host port so it never collides with the dev db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailcatcher_test:
    image: schickling/mailcatcher
    ports:
      - "1081:1080"
      - "1026:1025"
