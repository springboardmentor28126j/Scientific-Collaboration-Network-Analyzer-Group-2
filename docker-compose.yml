services:
  backend:
    build:
      context: ./backend
    container_name: scna-backend
    env_file:
      - ./backend/.env
    environment:
      FRONTEND_URL: http://frontend:5000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: scna-frontend
    env_file:
      - ./frontend/.env
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "5000:5000"
    depends_on:
      - backend
    restart: unless-stopped