services:
  scna:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside Docker, the chatbot connects to the local Ollama service,
      # not to the host machine's loopback address.
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  ollama-model-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c", "sleep 8; OLLAMA_HOST=ollama:11434 ollama pull qwen2.5:0.5b"]
    restart: "no"

volumes:
  ollama_models:
