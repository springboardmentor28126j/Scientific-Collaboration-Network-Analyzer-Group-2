<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet"
       href="{{ url_for('static', filename='css/edit_researcher.css') }}">

<title>Edit Researcher</title>

</head>


<body>

<div class="navbar">

    <div class="project-title">
        Scientific Collaboration Network Analyzer
    </div>

    <div class="navbar-right">
        Welcome, {{ session["full_name"] }}
    </div>

</div>


<div class="main">


<div class="edit-container">


<h1>
Edit Researcher
</h1>


<form method="POST">


<label>Full Name</label>

<input 
type="text"
name="full_name"
value="{{ researcher.full_name }}"
required>


<label>Email</label>

<input 
type="email"
name="email"
value="{{ researcher.email }}"
required>


<label>Institution</label>

<input 
type="text"
name="institution"
value="{{ researcher.institution }}"
required>


<label>Department</label>

<input 
type="text"
name="department"
value="{{ researcher.department }}"
required>


<label>Designation</label>

<input 
type="text"
name="designation"
value="{{ researcher.designation }}"
required>


<label>Research Interests</label>

<input 
type="text"
name="research_interests"
value="{{ researcher.research_interests }}">


<label>Skills</label>

<input 
type="text"
name="skills"
value="{{ researcher.skills }}">


<label>Phone</label>

<input 
type="text"
name="phone"
value="{{ researcher.phone }}">



<button class="update-btn">

Update Researcher

</button>


</form>


</div>


</div>


</body>
