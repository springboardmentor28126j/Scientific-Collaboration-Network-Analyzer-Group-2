<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Publication</title>


<link rel="stylesheet"
href="{{ url_for('static', filename='css/common.css') }}">


<link rel="stylesheet"
href="{{ url_for('static', filename='css/edit_researcher.css') }}">


</head>


<body>


<!-- ================= NAVBAR ================= -->

<div class="navbar">


<div class="navbar-left">


<button class="menu-btn" onclick="toggleSidebar()">
☰
</button>


<div class="project-title">
Scientific Collaboration Network Analyzer
</div>


</div>



<div class="navbar-right">

Welcome, {{ session["full_name"] }}

</div>


</div>





<!-- ================= SIDEBAR ================= -->


<div class="sidebar" id="sidebar">


<a href="{{ url_for('dashboard') }}">
Dashboard
</a>


<a href="{{ url_for('researchers') }}">
Researchers
</a>


<a href="{{ url_for('publications') }}" class="active">
Publications
</a>


<a href="#">
Collaborations
</a>


<a href="#">
Conferences
</a>


<a href="{{ url_for('researcher_profile') }}">
Profile
</a>


<a href="{{ url_for('logout') }}">
Logout
</a>


</div>






<!-- ================= MAIN ================= -->


<div class="main" id="main">


<div class="edit-container">


<h1>
Edit Publication
</h1>




<form 
method="POST"
enctype="multipart/form-data">



<input
type="hidden"
name="researcher_id"
value="{{ publication.researcher_id }}">





<label>
Title
</label>


<input
type="text"
name="title"
value="{{ publication.title }}"
required>





<label>
Publication Type
</label>


<select name="publication_type" required>


<option value="Journal"
{% if publication.publication_type == "Journal" %}selected{% endif %}>
Journal
</option>


<option value="Conference"
{% if publication.publication_type == "Conference" %}selected{% endif %}>
Conference
</option>


<option value="Book"
{% if publication.publication_type == "Book" %}selected{% endif %}>
Book
</option>


<option value="Patent"
{% if publication.publication_type == "Patent" %}selected{% endif %}>
Patent
</option>


<option value="Technical Report"
{% if publication.publication_type == "Technical Report" %}selected{% endif %}>
Technical Report
</option>


</select>


<label>
Journal Name
</label>


<input
type="text"
name="journal_name"
value="{{ publication.journal_name or '' }}">






<label>
Conference Name
</label>


<input
type="text"
name="conference_name"
value="{{ publication.conference_name or '' }}">






<label>
Publication Year
</label>


<input
type="number"
name="publication_year"
min="1900"
max="2100"
value="{{ publication.publication_year }}"
required>







<label>
DOI
</label>


<input
type="text"
name="doi"
value="{{ publication.doi or '' }}">

<label>
Status
</label>


<select name="status" required>


<option value="Draft"
{% if publication.status == "Draft" %}selected{% endif %}>
Draft
</option>


<option value="Submitted"
{% if publication.status == "Submitted" %}selected{% endif %}>
Submitted
</option>


<option value="Published"
{% if publication.status == "Published" %}selected{% endif %}>
Published
</option>


<option value="Archived"
{% if publication.status == "Archived" %}selected{% endif %}>
Archived
</option>


</select>

<label>
Current PDF
</label>

{% if publication.publication_file %}

<a href="http://127.0.0.1:8000/uploads/publications/{{ publication.publication_file }}" target="_blank">
View Current PDF
</a>

{% else %}

<p>No PDF Uploaded</p>

{% endif %}



<label>
Upload New Publication PDF (Optional)
</label>

<input
type="file"
name="publication_file"
accept=".pdf">


<br><br>


<button type="submit" class="update-btn">

Update Publication

</button>




</form>


</div>


</div>






<!-- ================= JAVASCRIPT ================= -->


<script>


function toggleSidebar(){


document.getElementById("sidebar").classList.toggle("active");


document.getElementById("main").classList.toggle("shift");


}


</script>




</body>

</html>
