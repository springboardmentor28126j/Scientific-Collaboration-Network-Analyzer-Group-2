<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Scientific Collaboration Network Analyzer | Login
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


<link rel="stylesheet" href="css/main.css">

<link rel="stylesheet" href="css/auth.css">


</head>


<body class="login-body">


<div class="container">


<div class="row justify-content-center align-items-center min-vh-100">


<div class="col-lg-5 col-md-7 login-column">


<div class="login-card">


<div class="text-center mb-4">


<div class="login-brand-mark"><i class="bi bi-diagram-3-fill"></i></div>

<h2 class="fw-bold mt-3">

Scientific Collaboration

</h2>


<h5 class="text-muted">

Network Analyzer

</h5>


<p class="text-muted mt-3">

Login to manage researchers, publications and collaborations.

</p>


</div>



<div id="messageBox"
class="alert d-none">
</div>



<form id="loginForm">


<div class="mb-3">


<label class="form-label">

Email Address

</label>


<input

type="email"

id="email"

class="form-control"

placeholder="Enter email"

required>


</div>



<div class="mb-4">


<label class="form-label">

Password

</label>


<div class="input-group password-input-group"><input type="password" id="password" class="form-control" placeholder="Enter password" required><button id="passwordToggle" class="btn btn-outline-secondary" type="button" aria-label="Show password"><i class="bi bi-eye"></i></button></div>


</div>

<div class="mb-4">

<div class="d-flex justify-content-between align-items-center mb-2">
<label class="form-label mb-0">Security check</label>
<button type="button" id="refreshCaptcha" class="btn btn-sm btn-link p-0"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
</div>
<div class="input-group">
<span id="captchaQuestion" class="input-group-text">Loading…</span>
<input type="number" id="captchaAnswer" class="form-control" placeholder="Answer" inputmode="numeric" required>
</div>
<input type="hidden" id="captchaToken">
<div class="form-text">Complete this short check before signing in.</div>
</div>




<button

type="submit"

id="loginBtn"

class="btn btn-primary w-100 btn-lg">


<i class="bi bi-box-arrow-in-right"></i>

Login


</button>



</form>

<div class="auth-divider"><span>or continue with</span></div>
<a class="btn btn-google w-100" href="http://127.0.0.1:8000/users/oauth/google"><i class="bi bi-google me-2"></i>Continue with Google</a>
<p class="auth-security-note mb-0"><i class="bi bi-shield-check"></i> Your account access stays protected.</p>




<hr>



<div class="text-center">


<p>

Don't have an account?


<a href="register.html"
class="fw-bold">

Create Account

</a>


</p>


</div>


</div>


</div>


</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script src="js/api.js"></script>


<script src="js/pages/auth.js"></script>


</body>

</html>
