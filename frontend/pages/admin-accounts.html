<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Directory | SCNA</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css"></head>
<body><nav class="navbar app-navbar navbar-dark"><div class="container-fluid"><a class="navbar-brand fw-bold" href="../dashboard.html">Scientific Collaboration Network Analyzer</a></div></nav><main class="page-container"><div class="d-flex justify-content-between align-items-start mb-4"><div><h1 class="h2 fw-bold mb-1">Account directory</h1><p class="text-muted mb-0">Review active accounts and assign the researcher or institution workspace they can access.</p></div><a class="btn btn-outline-primary" href="admin-approvals.html"><i class="bi bi-person-check"></i> Pending approvals</a></div><div id="message"></div><div class="custom-card p-4"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Account</th><th>Role</th><th>Researcher workspace</th><th>Institution workspace</th><th class="text-end">Save</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="text-center text-muted">Loading accounts...</td></tr></tbody></table></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/layout.js"></script><script>
const api='http://127.0.0.1:8000',headers={'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('token')},rows=document.getElementById('rows'),message=document.getElementById('message');let researchers=[],institutions=[];const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const opts=(items,value,label)=>`<option value="">No ${label}</option>`+items.map(item=>`<option value="${item.id}" ${item.id===value?'selected':''}>${esc(item.full_name||item.name)}</option>`).join('');async function load(){const [a,r,i]=await Promise.all([fetch(api+'/users/accounts',{headers}),fetch(api+'/researchers/',{headers}),fetch(api+'/institutions/',{headers})]);if(!a.ok){rows.innerHTML='<tr><td colspan="5" class="text-center text-danger">Unable to load accounts.</td></tr>';return}researchers=await r.json();institutions=await i.json();const accounts=await a.json();rows.innerHTML=accounts.map(x=>`<tr><td><strong>${esc(x.name)}</strong><small class="d-block text-muted">${esc(x.email)}</small></td><td><span class="badge text-bg-light border">${esc(x.role)}</span><small class="d-block text-muted">${esc(x.account_status)}</small></td><td><select id="r-${x.id}" class="form-select form-select-sm">${opts(researchers,x.researcher_id,'researcher')}</select></td><td><select id="i-${x.id}" class="form-select form-select-sm">${opts(institutions,x.institution_id,'institution')}</select></td><td class="text-end"><button class="btn btn-sm btn-primary" onclick="save(${x.id})">Save</button></td></tr>`).join('')||'<tr><td colspan="5" class="text-center text-muted">No accounts found.</td></tr>'}async function save(id){const payload={researcher_id:Number(document.getElementById('r-'+id).value)||null,institution_id:Number(document.getElementById('i-'+id).value)||null},response=await fetch(`${api}/users/${id}/assignment`,{method:'PUT',headers,body:JSON.stringify(payload)}),data=await response.json();message.innerHTML=`<div class="alert ${response.ok?'alert-success':'alert-danger'}">${esc(response.ok?data.message:(data.detail||'Unable to save assignment.'))}</div>`;if(response.ok)load()}load().catch(()=>rows.innerHTML='<tr><td colspan="5" class="text-center text-danger">Unable to load accounts.</td></tr>');
</script></body></html>
