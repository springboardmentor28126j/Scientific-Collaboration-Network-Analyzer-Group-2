<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Approvals | SCNA</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css"></head>
<body><nav class="navbar app-navbar navbar-dark"><div class="container-fluid"><a class="navbar-brand fw-bold" href="../dashboard.html">Scientific Collaboration Network Analyzer</a></div></nav><main class="page-container"><div class="d-flex justify-content-between align-items-start mb-4"><div><h1 class="h2 fw-bold mb-1">Account approvals</h1><p class="text-muted mb-0">Approve a role only after assigning the correct researcher or institution workspace.</p></div><a class="btn btn-outline-primary" href="audit-logs.html"><i class="bi bi-shield-check"></i> Audit log</a></div><div id="message"></div><div class="custom-card p-4"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Requester</th><th>Requested role</th><th>Workspace assignment</th><th class="text-end">Action</th></tr></thead><tbody id="requests"><tr><td colspan="4" class="text-center text-muted">Loading requests...</td></tr></tbody></table></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/layout.js"></script><script>
const api='http://127.0.0.1:8000',headers={'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('token')},requests=document.getElementById('requests'),message=document.getElementById('message');let researchers=[],institutions=[];const escape=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));const optionRows=(items,label)=>`<option value="">Select ${label}</option>`+items.map(item=>`<option value="${item.id}">${escape(item.full_name||item.name)}</option>`).join('');function alertMessage(ok,text){message.innerHTML=`<div class="alert ${ok?'alert-success':'alert-danger'} alert-dismissible fade show">${escape(text)}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`}async function load(){const [pending,rs,ins]=await Promise.all([fetch(api+'/users/pending',{headers}),fetch(api+'/researchers/',{headers}),fetch(api+'/institutions/',{headers})]);if(!pending.ok){requests.innerHTML='<tr><td colspan="4" class="text-center text-danger">Unable to load account requests.</td></tr>';return}researchers=await rs.json();institutions=await ins.json();const items=await pending.json();requests.innerHTML=items.length?items.map(item=>{const role=String(item.requested_role||'').toLowerCase();const select=role==='researcher'?`<select id="researcher-${item.id}" class="form-select form-select-sm">${optionRows(researchers,'researcher')}</select>`:role==='institution admin'?`<select id="institution-${item.id}" class="form-select form-select-sm">${optionRows(institutions,'institution')}</select>`:'<span class="text-muted small">No workspace link required for this role.</span>';return `<tr><td><strong>${escape(item.name)}</strong><small class="d-block text-muted">${escape(item.email)}</small></td><td><span class="badge text-bg-warning">${escape(item.requested_role)}</span></td><td>${select}</td><td class="text-end text-nowrap"><button class="btn btn-sm btn-success" onclick="approve(${item.id},'${escape(item.requested_role)}')"><i class="bi bi-check-lg"></i> Approve</button> <button class="btn btn-sm btn-outline-danger" onclick="reject(${item.id})"><i class="bi bi-x-lg"></i></button></td></tr>`}).join(''):'<tr><td colspan="4" class="text-center text-muted py-4">No pending account requests.</td></tr>'}async function approve(id,role){const normal=role.toLowerCase(),body={approved_role:role};if(normal==='researcher')body.researcher_id=Number(document.getElementById('researcher-'+id).value)||null;if(normal==='institution admin')body.institution_id=Number(document.getElementById('institution-'+id).value)||null;const response=await fetch(`${api}/users/${id}/approve`,{method:'POST',headers,body:JSON.stringify(body)});const data=await response.json();alertMessage(response.ok,response.ok?data.message:(data.detail||'Approval failed.'));if(response.ok)load()}async function reject(id){const reason=window.prompt('Why is this request being rejected? This reason is sent to the requester.');if(!reason)return;const response=await fetch(`${api}/users/${id}/reject`,{method:'POST',headers,body:JSON.stringify({reason})});const data=await response.json();alertMessage(response.ok,response.ok?data.message:(data.detail||'Rejection failed.'));if(response.ok)load()}load().catch(()=>{requests.innerHTML='<tr><td colspan="4" class="text-center text-danger">Unable to load account requests.</td></tr>'});
</script></body></html>
