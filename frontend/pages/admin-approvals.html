<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Approvals | SCNA</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css"></head>
<body><nav class="navbar app-navbar navbar-dark"><div class="container-fluid"><a class="navbar-brand fw-bold" href="../dashboard.html">Scientific Collaboration Network Analyzer</a></div></nav><main class="page-container"><div class="mb-4"><h1 class="h2 fw-bold mb-1">Account approvals</h1><p class="text-muted mb-0">Review requests for Institution Admin, Publisher, and Reviewer access.</p></div><div id="message"></div><div class="custom-card p-4"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Name</th><th>Email</th><th>Requested role</th><th class="text-end">Action</th></tr></thead><tbody id="requests"><tr><td colspan="4" class="text-center text-muted">Loading requests...</td></tr></tbody></table></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/layout.js"></script><script>const api='http://127.0.0.1:8000/users',headers={'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('token')},requests=document.getElementById('requests'),message=document.getElementById('message');const escape=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));async function load(){const response=await fetch(api+'/pending',{headers});if(!response.ok){requests.innerHTML='<tr><td colspan="4" class="text-center text-danger">Unable to load account requests.</td></tr>';return}const items=await response.json();requests.innerHTML=items.length?items.map(item=>`<tr><td>${escape(item.name)}</td><td>${escape(item.email)}</td><td><span class="badge text-bg-warning">${escape(item.requested_role)}</span></td><td class="text-end"><button class="btn btn-sm btn-success" onclick="approve(${item.id},'${escape(item.requested_role)}')"><i class="bi bi-check-lg"></i> Approve</button></td></tr>`).join(''):'<tr><td colspan="4" class="text-center text-muted py-4">No pending account requests.</td></tr>'}async function approve(id,role){const response=await fetch(`${api}/${id}/approve`,{method:'POST',headers,body:JSON.stringify({approved_role:role})});const data=await response.json();message.innerHTML=`<div class="alert ${response.ok?'alert-success':'alert-danger'}">${escape(response.ok?data.message:(data.detail||'Approval failed.'))}</div>`;if(response.ok)load()}load();</script></body></html>
