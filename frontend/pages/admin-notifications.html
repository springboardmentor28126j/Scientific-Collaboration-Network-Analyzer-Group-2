<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Announcement | SCNA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <nav class="navbar app-navbar navbar-dark"><div class="container-fluid"><a class="navbar-brand fw-bold" href="../dashboard.html">Scientific Collaboration Network Analyzer</a></div></nav>
  <main class="page-container">
    <div class="mb-4"><h1 class="h2 fw-bold mb-1">Send announcement</h1><p class="text-muted mb-0">Send an in-app notification and optional professional email to your users.</p></div>
    <div id="adminWarning" class="alert alert-danger d-none">Only an administrator can send announcements.</div>
    <div class="custom-card p-4" style="max-width:800px">
      <form id="announcementForm">
        <label class="form-label fw-semibold" for="announcementTitle">Subject</label>
        <input id="announcementTitle" class="form-control mb-3" maxlength="120" required placeholder="Example: Research review meeting">
        <label class="form-label fw-semibold" for="announcementMessage">Message</label>
        <textarea id="announcementMessage" class="form-control mb-3" rows="5" maxlength="1000" required placeholder="Write the announcement for your users..."></textarea>
        <label class="form-label fw-semibold" for="announcementLink">Optional page link</label>
        <input id="announcementLink" class="form-control mb-3" placeholder="pages/report.html">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2"><label class="form-label fw-semibold mb-0">Recipients</label><div><button id="selectAll" class="btn btn-sm btn-outline-primary" type="button">Select all</button><button id="clearAll" class="btn btn-sm btn-outline-secondary" type="button">Clear</button></div></div>
        <div id="recipientList" class="border rounded-3 p-2 mb-3" style="max-height:240px;overflow:auto"><div class="text-muted p-2">Loading users...</div></div>
        <div class="form-check form-switch mb-4"><input id="sendEmail" class="form-check-input" type="checkbox" checked><label class="form-check-label" for="sendEmail">Also send this announcement by email</label></div>
        <div id="formMessage" class="alert d-none"></div>
        <button class="btn btn-primary" type="submit"><i class="bi bi-send me-2"></i>Send announcement</button>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/layout.js"></script>
  <script>
    const api = 'http://127.0.0.1:8000/notifications';
    const token = localStorage.getItem('token');
    const headers = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token };
    const list = document.getElementById('recipientList');
    const formMessage = document.getElementById('formMessage');
    if (!(localStorage.getItem('role') || '').toLowerCase().includes('admin')) { document.getElementById('adminWarning').classList.remove('d-none'); document.getElementById('announcementForm').classList.add('d-none'); }
    fetch(api + '/recipients', { headers }).then(async response => { if (response.ok) return response.json(); const error = await response.json(); throw new Error(error.detail || 'Unable to load recipients.'); }).then(recipients => { list.innerHTML = recipients.map(recipient => `<label class="d-flex gap-2 align-items-center p-2 border-bottom"><input class="recipient-check form-check-input m-0" type="checkbox" value="${recipient.key}"><span><strong>${recipient.name}</strong><small class="d-block text-muted">${recipient.email} · ${recipient.kind} · ${recipient.role}</small></span></label>`).join('') || '<div class="text-muted p-2">No recipients found.</div>'; }).catch(error => { list.innerHTML = `<div class="text-danger p-2">${error.message}. Please sign out and sign in again if your session has expired.</div>`; });
    document.getElementById('selectAll').onclick = () => document.querySelectorAll('.recipient-check').forEach(item => item.checked = true);
    document.getElementById('clearAll').onclick = () => document.querySelectorAll('.recipient-check').forEach(item => item.checked = false);
    document.getElementById('announcementForm').onsubmit = async event => { event.preventDefault(); const recipients = [...document.querySelectorAll('.recipient-check:checked')].map(item => item.value); const payload = { title: document.getElementById('announcementTitle').value, message: document.getElementById('announcementMessage').value, link: document.getElementById('announcementLink').value || null, recipient_ids: recipients.length ? recipients : null, send_email: document.getElementById('sendEmail').checked }; const response = await fetch(api + '/announcement', { method: 'POST', headers, body: JSON.stringify(payload) }); const data = await response.json(); formMessage.className = `alert ${response.ok ? 'alert-success' : 'alert-danger'}`; formMessage.textContent = response.ok ? `Announcement created for ${data.recipient_count} recipient(s). In-app alerts: ${data.in_app_count}. ${payload.send_email ? (data.email_configured ? `Emails accepted by Resend: ${data.email_accepted_count}.` : 'Emails were not sent because Resend is not configured yet.') : 'Email sending was turned off.'}` : (data.detail || 'Unable to send announcement.'); formMessage.classList.remove('d-none'); if (response.ok) event.target.reset(); };
  </script>
</body>
</html>
