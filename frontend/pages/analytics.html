<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics | Scientific Collaboration Network Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css">
  <style>.analytics-chart{height:360px;position:relative}.analytics-toolbar{min-width:min(100%,340px)}</style>
</head>
<body>
  <nav class="navbar app-navbar navbar-dark"><div class="container-fluid"><a class="navbar-brand fw-bold" href="report.html"><i class="bi bi-file-earmark-bar-graph"></i> Reports & Analytics</a></div></nav>
  <main class="page-container"><div class="row justify-content-center"><div class="col-xl-10">
    <a class="btn btn-outline-secondary btn-sm mb-4" href="report.html"><i class="bi bi-arrow-left"></i> All reports</a>
    <section class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4"><div><h1 id="analyticsTitle" class="h3 mb-1">Analytics</h1><p id="analyticsDescription" class="text-muted mb-0">Loading overall analytics...</p></div><div id="publicationFilter" class="analytics-toolbar"><label for="institutionSearch" class="form-label small mb-1">Filter by institution</label><div class="input-group"><input id="institutionSearch" class="form-control" list="institutionOptions" placeholder="Search by institution name or ID"><datalist id="institutionOptions"></datalist><button class="btn btn-primary" id="applyInstitutionFilter" type="button">Search</button><button class="btn btn-outline-secondary" id="clearInstitutionFilter" type="button">Clear</button></div></div></section>
    <div id="analyticsMessage"></div>
    <section class="row g-4" id="analyticsPanels"></section>
  </div></div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/layout.js"></script>
  <script>
    const section = new URLSearchParams(location.search).get("section") || "publications";
    const apiBaseUrl = "http://127.0.0.1:8000";
    const panels = document.getElementById("analyticsPanels");
    const title = document.getElementById("analyticsTitle");
    const description = document.getElementById("analyticsDescription");
    const message = document.getElementById("analyticsMessage");
    const publicationFilter = document.getElementById("publicationFilter");
    const institutionSearch = document.getElementById("institutionSearch");
    const institutionOptions = document.getElementById("institutionOptions");
    const config = {
      publications: { title: "Publication Analytics", description: "Overall publication trends, status, and types." },
      researchers: { title: "Researcher Analytics", description: "Overall researcher productivity across all institutions." },
      collaborations: { title: "Collaboration Analytics", description: "Overall collaboration activity across all researchers." },
      institutions: { title: "Institution Analytics", description: "Overall comparison of researchers and publications by institution." }
    };
    const safeSection = config[section] ? section : "publications";
    title.textContent = config[safeSection].title; description.textContent = config[safeSection].description;
    const colors = { published: "#198754", submitted: "#0d6efd", draft: "#ffc107", archived: "#6c757d" };
    function panel(heading, caption, id, column = "col-12") { return `<div class="${column}"><section class="custom-card p-4 h-100"><h2 class="h5 mb-1">${heading}</h2><p class="text-muted small mb-3">${caption}</p><div class="analytics-chart"><canvas id="${id}"></canvas></div></section></div>`; }
    function chart(id, type, data, options = {}) { return new Chart(document.getElementById(id), { type, data, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "top" } }, ...options } }); }
    let institutionIndex = new Map();
    function render(data) {
      institutionIndex = new Map(data.institution_options.map(item => [`${item.name} — ID ${item.id}`.toLowerCase(), item.id]));
      data.institution_options.forEach(item => institutionIndex.set(item.name.toLowerCase(), item.id));
      institutionOptions.innerHTML = data.institution_options.map(item => `<option value="${item.name} — ID ${item.id}"></option>`).join("");
      if (data.scope.institution_name) institutionSearch.value = `${data.scope.institution_name} — ID ${data.scope.institution_id}`;
      else institutionSearch.value = "";
      if (safeSection === "publications") {
        description.textContent = data.scope.institution_name ? `Publication analytics for ${data.scope.institution_name}.` : "Overall publication analytics across every institution.";
        panels.innerHTML = panel("Publication Volume Over Time", "Total publications recorded in each year.", "trendChart", "col-lg-6") + panel("Publication Status by Year", "Status breakdown for each publication year.", "statusChart", "col-lg-6") + panel("Publication Types", "Distribution of all publication types.", "typeChart", "col-lg-6");
        const years = data.publication_status_by_year;
        chart("trendChart", "line", { labels: years.map(row => row.year), datasets: [{ label: "Total Publications", data: years.map(row => row.total), borderColor: "#0d6efd", backgroundColor: "rgba(13,110,253,.14)", fill: true, tension: .25, pointRadius: 4 }] }, { scales: { y: { beginAtZero: true, ticks: { precision: 0 }, title: { display: true, text: "Number of publications" } }, x: { title: { display: true, text: "Publication year" } } } });
        chart("statusChart", "bar", { labels: years.map(row => row.year), datasets: Object.keys(colors).map(status => ({ label: status[0].toUpperCase() + status.slice(1), data: years.map(row => row[status]), backgroundColor: colors[status], borderRadius: 5 })) }, { scales: { y: { stacked: true, beginAtZero: true, ticks: { precision: 0 }, title: { display: true, text: "Number of publications" } }, x: { stacked: true, title: { display: true, text: "Publication year" } } } });
        chart("typeChart", "doughnut", { labels: data.publication_types.map(row => row.type), datasets: [{ data: data.publication_types.map(row => row.count), backgroundColor: ["#0d6efd", "#198754", "#ffc107", "#6f42c1", "#dc3545"] }] });
      } else if (safeSection === "researchers") {
        description.textContent = data.scope.institution_name ? `Researcher analytics for ${data.scope.institution_name}.` : "Overall researcher productivity across every institution.";
        panels.innerHTML = panel("Top Researchers by Publications", "Researchers ranked by assigned publication count.", "researcherChart");
        chart("researcherChart", "bar", { labels: data.top_researchers.map(row => row.name), datasets: [{ label: "Publications", data: data.top_researchers.map(row => row.publications), backgroundColor: "#0d6efd", borderRadius: 5 }] }, { indexAxis: "y", scales: { x: { beginAtZero: true, ticks: { precision: 0 }, title: { display: true, text: "Publications" } } } });
      } else if (safeSection === "collaborations") {
        description.textContent = data.scope.institution_name ? `Collaboration analytics for ${data.scope.institution_name}.` : "Overall collaboration activity across every institution.";
        panels.innerHTML = panel("Most Active Collaborators", "Researchers ranked by recorded collaborations.", "collaborationChart");
        chart("collaborationChart", "bar", { labels: data.top_collaborators.map(row => row.name), datasets: [{ label: "Collaborations", data: data.top_collaborators.map(row => row.collaborations), backgroundColor: "#6f42c1", borderRadius: 5 }] }, { indexAxis: "y", scales: { x: { beginAtZero: true, ticks: { precision: 0 }, title: { display: true, text: "Collaborations" } } } });
      } else {
        description.textContent = data.scope.institution_name ? `Institution analytics for ${data.scope.institution_name}.` : "Overall comparison of researchers and publications by institution.";
        panels.innerHTML = panel("Researchers and Publications by Institution", "Compare all institutions using their recorded totals.", "institutionChart");
        chart("institutionChart", "bar", { labels: data.institutions.map(row => row.name), datasets: [{ label: "Researchers", data: data.institutions.map(row => row.researchers), backgroundColor: "#0d6efd", borderRadius: 5 }, { label: "Publications", data: data.institutions.map(row => row.publications), backgroundColor: "#198754", borderRadius: 5 }] }, { scales: { y: { beginAtZero: true, ticks: { precision: 0 }, title: { display: true, text: "Count" } } } });
      }
    }
    function loadAnalytics(institutionId = null) {
      message.innerHTML = '<div class="alert alert-info">Loading analytics...</div>';
      const query = institutionId ? `?institution_id=${encodeURIComponent(institutionId)}` : "";
      fetch(`${apiBaseUrl}/reports/analytics${query}`).then(response => response.ok ? response.json() : response.json().then(data => Promise.reject(data))).then(data => { message.innerHTML = ""; render(data); }).catch(error => { message.innerHTML = `<div class="alert alert-danger">${error.detail || "Analytics are unavailable. Start the API and add records to view this report."}</div>`; });
    }
    function applyInstitutionFilter() {
      const value = institutionSearch.value.trim().toLowerCase();
      const id = institutionIndex.get(value) || (/^\d+$/.test(value) ? Number(value) : null);
      if (!id) { message.innerHTML = '<div class="alert alert-warning">Select an institution from the search suggestions or enter its numeric ID.</div>'; return; }
      loadAnalytics(id);
    }
    document.getElementById("applyInstitutionFilter").addEventListener("click", applyInstitutionFilter);
    document.getElementById("clearInstitutionFilter").addEventListener("click", () => loadAnalytics());
    institutionSearch.addEventListener("keydown", event => { if (event.key === "Enter") applyInstitutionFilter(); });
    loadAnalytics();
  </script>
</body></html>
