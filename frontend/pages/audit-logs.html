<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Log | SCNA</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css"></head>
<body><nav class="navbar app-navbar navbar-dark"><div class="container-fluid"><a class="navbar-brand fw-bold" href="../dashboard.html">Scientific Collaboration Network Analyzer</a></div></nav><main class="page-container"><div class="mb-4"><h1 class="h2 fw-bold mb-1">Security & activity audit</h1><p class="text-muted mb-0">Permanent history of user, publication, project, review, and security events.</p></div><div class="custom-card p-4"><div class="row g-2 mb-3"><div class="col-md-4"><input id="action" class="form-control" placeholder="Search action, for example login or updated"></div><div class="col-md-3"><select id="entity" class="form-select"><option value="">All modules</option><option value="user">Users</option><option value="security">Security</option><option value="researcher">Researchers</option><option value="publication">Publications</option><option value="project">Projects</option><option value="conference">Conferences</option><option value="collaboration">Collaborations</option><option value="citation">Citations</option><option value="review">Reviews</option><option value="announcement">Announcements</option></select></div><div class="col-md-2"><button id="filter" class="btn btn-primary w-100">Apply filters</button></div></div><div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Date & time</th><th>User</th><th>Role</th><th>Module</th><th>Action</th><th>Description</th><th>IP address</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="text-center text-muted">Loading activity...</td></tr></tbody></table></div><div class="d-flex justify-content-between align-items-center"><small id="summary" class="text-muted"></small><div><button id="previous" class="btn btn-sm btn-outline-secondary">Previous</button><button id="next" class="btn btn-sm btn-outline-secondary">Next</button></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/layout.js"></script><script>const api='http://127.0.0.1:8000/audit-logs/',headers={Authorization:'Bearer '+localStorage.getItem('token')},rows=document.getElementById('rows'),escape=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let page=1,total=0;async function load(){const p=new URLSearchParams({page,page_size:20});if(action.value.trim())p.set('action',action.value.trim());if(entity.value)p.set('entity_type',entity.value);const response=await fetch(api+'?'+p,{headers});if(!response.ok){rows.innerHTML='<tr><td colspan="7" class="text-danger text-center">Audit log is unavailable.</td></tr>';return}const data=await response.json();total=data.total;rows.innerHTML=data.items.length?data.items.map(x=>`<tr><td class="text-nowrap">${x.created_at?new Date(x.created_at).toLocaleString():'—'}</td><td>${escape(x.actor)}</td><td>${escape(x.role||'System')}</td><td>${escape(x.entity_type)}${x.entity_id?' #'+x.entity_id:''}</td><td><span class="badge text-bg-light border">${escape(x.action)}</span></td><td>${escape(x.details||'—')}</td><td class="text-nowrap">${escape(x.ip_address||'Not recorded')}</td></tr>`).join(''):'<tr><td colspan="7" class="text-center text-muted">No matching activity.</td></tr>';summary.textContent=`Showing page ${page} of ${Math.max(1,Math.ceil(total/20))} (${total} records)`;previous.disabled=page===1;next.disabled=page*20>=total}filter.onclick=()=>{page=1;load()};previous.onclick=()=>{page--;load()};next.onclick=()=>{page++;load()};load();</script></body></html>
