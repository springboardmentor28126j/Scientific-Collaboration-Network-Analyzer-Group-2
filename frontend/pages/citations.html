<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citations | Scientific Collaboration Network Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <nav class="navbar app-navbar navbar-dark"><div class="container-fluid"><span class="navbar-brand fw-bold"><i class="bi bi-quote"></i> Citation & Reference Management</span></div></nav>
  <main class="page-container"><div class="row g-4"><section class="col-lg-4"><div class="custom-card p-4"><h3 class="h5">Link Publications</h3><p class="text-muted small">Create a citation record between two publication IDs.</p><form id="citationForm"><label class="form-label">Citing publication ID</label><input id="citingId" type="number" class="form-control mb-3" required><label class="form-label">Cited publication ID</label><input id="citedId" type="number" class="form-control mb-3" required><button class="btn btn-primary w-100"><i class="bi bi-plus-circle"></i> Add Citation</button></form></div></section><section class="col-lg-8"><div class="custom-card p-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><h2 class="h4 mb-0">Citation Records</h2><small class="text-muted" id="citationCount">Loading…</small></div><i class="bi bi-journal-check display-6 text-primary"></i></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>#</th><th>Citing publication</th><th>Cited publication</th><th>Relationship</th></tr></thead><tbody id="citationRows"></tbody></table></div></div></section></div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    const CITATIONS_API="http://127.0.0.1:8000/citations/";
    async function loadCitations(){const response=await fetch(CITATIONS_API);const items=await response.json();citationCount.textContent=`${items.length} records`;citationRows.innerHTML=items.length?items.map(item=>`<tr><td>${item.id}</td><td><span class="badge text-bg-light">Publication ${item.citing_publication_id}</span></td><td><span class="badge text-bg-light">Publication ${item.cited_publication_id}</span></td><td><i class="bi bi-arrow-right text-primary"></i> cites</td></tr>`).join(""):'<tr><td colspan="4" class="text-center text-muted">No citation records yet.</td></tr>';}
    citationForm.addEventListener("submit",async event=>{event.preventDefault();const payload={citing_publication_id:Number(citingId.value),cited_publication_id:Number(citedId.value)};if(payload.citing_publication_id===payload.cited_publication_id){alert("Choose two different publications.");return;}const response=await fetch(CITATIONS_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});if(!response.ok){alert((await response.json()).detail||"Unable to create citation.");return;}citationForm.reset();loadCitations();});loadCitations();
  </script>
</body>
</html>
