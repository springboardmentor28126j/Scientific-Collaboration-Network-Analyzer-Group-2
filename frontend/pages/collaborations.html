<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collaborations | Scientific Collaboration Network Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <nav class="navbar app-navbar navbar-dark"><div class="container-fluid"><a class="navbar-brand fw-bold" href="../dashboard.html"><i class="bi bi-people-fill"></i> Collaboration Management</a></div></nav>
  <main class="page-container">
    <div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="fw-bold">Collaborations</h2><p class="text-muted mb-0">Manage research relationships, project teams, and publication collaborations.</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#collaborationModal" onclick="resetForm()"><i class="bi bi-plus-circle"></i> Add Collaboration</button></div>
    <div class="alert alert-info"><i class="bi bi-info-circle"></i> Use researcher IDs from the Researchers page. Researchers must be different.</div>
    <div class="custom-card p-4"><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>ID</th><th>Researcher 1</th><th>Researcher 2</th><th>Project</th><th>Publication ID</th><th class="text-end">Actions</th></tr></thead><tbody id="collaborationRows"><tr><td colspan="6" class="text-center text-muted">Loading collaborations…</td></tr></tbody></table></div></div>
  </main>
  <div class="modal fade" id="collaborationModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="modalTitle">Add Collaboration</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="collaborationForm"><input type="hidden" id="collaborationId"><label class="form-label">Researcher 1 ID</label><input id="researcher1Id" type="number" class="form-control mb-3" required><label class="form-label">Researcher 2 ID</label><input id="researcher2Id" type="number" class="form-control mb-3" required><label class="form-label">Project</label><input id="project" class="form-control mb-3" placeholder="Optional project name"><label class="form-label">Publication ID</label><input id="publicationId" type="number" class="form-control mb-3" placeholder="Optional publication ID"><button class="btn btn-primary w-100">Save Collaboration</button></form></div></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/collaborations.js"></script>
</body>
</html>
