<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Quality | SCNA</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css"></head>
<body><nav class="navbar app-navbar navbar-dark"><div class="container-fluid"><a class="navbar-brand fw-bold" href="../dashboard.html">Scientific Collaboration Network Analyzer</a></div></nav><main class="page-container"><div class="mb-4"><h1 class="h2 fw-bold mb-1">Data quality</h1><p class="text-muted mb-0">Find incomplete research records before they affect reports and analytics.</p></div><div id="content" class="row g-3"><div class="col-12 text-muted">Running data checks...</div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/layout.js"></script><script>const api='http://127.0.0.1:8000/admin/data-quality',headers={Authorization:'Bearer '+localStorage.getItem('token')},content=document.getElementById('content'),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));fetch(api,{headers}).then(r=>r.ok?r.json():Promise.reject()).then(data=>{const labels={publications_missing_doi:'Publications missing DOI',publications_without_authors:'Publications without authors',researchers_without_institution:'Researchers without institution',researchers_missing_email:'Researchers missing email',suspended_accounts:'Suspended accounts'};content.innerHTML=Object.entries(data.summary).map(([key,value])=>`<div class="col-md-4"><div class="custom-card p-3"><small class="text-muted">${labels[key]}</small><div class="fs-2 fw-bold ${value?'text-warning':'text-success'}">${value}</div></div></div>`).join('')+Object.entries(data.issues).map(([key,items])=>`<div class="col-lg-6"><div class="custom-card p-4 h-100"><h2 class="h6">${labels[key]}</h2>${items.length?`<ul class="mb-0">${items.map(x=>`<li>${esc(x.title||x.name)} <span class="text-muted">#${x.id}</span></li>`).join('')}</ul>`:'<p class="text-success mb-0">No issues found.</p>'}</div></div>`).join('')}).catch(()=>content.innerHTML='<div class="col-12"><div class="alert alert-danger">Data-quality checks are available only to a System Admin.</div></div>');</script></body></html>
