<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Profile | Scientific Collaboration Network Analyzer</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css"></head>
<body><nav class="navbar app-navbar navbar-dark"><div class="container-fluid"><span class="navbar-brand fw-bold"><i class="bi bi-person-vcard"></i> My Profile</span></div></nav><main class="page-container"><div class="row justify-content-center"><div class="col-lg-7"><div class="custom-card p-5 text-center"><div class="display-3 text-primary mb-3"><i class="bi bi-person-circle"></i></div><h2 id="profileName">User</h2><p class="text-muted" id="profileRole">Researcher</p><hr><div class="row text-start g-3"><div class="col-sm-6"><small class="text-muted">Name</small><div class="fw-semibold" id="profileNameDetail"></div></div><div class="col-sm-6"><small class="text-muted">Role</small><div class="fw-semibold" id="profileRoleDetail"></div></div><div class="col-12"><small class="text-muted">Session</small><div class="fw-semibold text-success"><i class="bi bi-shield-check"></i> Signed in</div></div></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/layout.js"></script><script>const name=localStorage.getItem("username")||"User";const role=localStorage.getItem("role")||"Researcher";document.getElementById("profileName").textContent=name;document.getElementById("profileRole").textContent=role;document.getElementById("profileNameDetail").textContent=name;document.getElementById("profileRoleDetail").textContent=role;</script></body></html>
