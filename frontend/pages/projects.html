<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Scientific Collaboration Network Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="dashboard-body">
  <nav class="navbar navbar-dark bg-primary"><div class="container-fluid">
    <a class="navbar-brand fw-bold" href="../dashboard.html"><i class="bi bi-folder2-open"></i> Research Project Tracking</a>
    <a href="../dashboard.html" class="btn btn-light">Dashboard</a>
  </div></nav>
  <main class="container mt-4">
    <div class="row g-4">
      <section class="col-lg-4"><div class="card shadow-sm"><div class="card-body">
        <h4>Create Project</h4>
        <form id="projectForm">
          <input id="title" class="form-control mb-2" placeholder="Project title" required>
          <textarea id="description" class="form-control mb-2" placeholder="Description"></textarea>
          <input id="fundingAgency" class="form-control mb-2" placeholder="Funding agency">
          <select id="status" class="form-select mb-2"><option value="planned">Planned</option><option value="active">Active</option><option value="completed">Completed</option></select>
          <input id="institutionId" type="number" class="form-control mb-2" placeholder="Institution ID (optional)">
          <button class="btn btn-primary w-100">Save Project</button>
        </form>
      </div></div></section>
      <section class="col-lg-8"><div class="card shadow-sm"><div class="card-body">
        <h4>Projects</h4><p class="text-muted">Track research initiatives, funding agencies, and their current progress.</p>
        <div class="table-responsive"><table class="table"><thead><tr><th>Title</th><th>Status</th><th>Funding agency</th><th>Institution</th></tr></thead><tbody id="projectRows"></tbody></table></div>
      </div></div></section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    const PROJECTS_API = "http://127.0.0.1:8000/projects/";
    const projectRows = document.getElementById("projectRows");
    async function loadProjects() {
      const response = await fetch(PROJECTS_API); const projects = await response.json();
      projectRows.innerHTML = projects.length ? projects.map(p => `<tr><td>${p.title}</td><td><span class="badge text-bg-primary">${p.status}</span></td><td>${p.funding_agency || "-"}</td><td>${p.institution_id || "-"}</td></tr>`).join("") : '<tr><td colspan="4" class="text-muted">No projects created yet.</td></tr>';
    }
    document.getElementById("projectForm").addEventListener("submit", async event => {
      event.preventDefault();
      const payload = { title: document.getElementById("title").value.trim(), description: document.getElementById("description").value.trim() || null, funding_agency: document.getElementById("fundingAgency").value.trim() || null, status: document.getElementById("status").value, institution_id: document.getElementById("institutionId").value ? Number(document.getElementById("institutionId").value) : null };
      const response = await fetch(PROJECTS_API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
      if (!response.ok) { alert((await response.json()).detail || "Could not create project"); return; }
      event.target.reset(); loadProjects();
    });
    loadProjects();
  </script>
</body>
</html>
