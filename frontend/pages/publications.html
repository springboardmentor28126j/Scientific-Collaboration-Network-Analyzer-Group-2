<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Publication Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="../css/style.css">
    <link rel="stylesheet" href="../css/main.css">

</head>

<body class="dashboard-body">

<nav class="navbar navbar-dark bg-primary">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold"
           href="../dashboard.html">

            Scientific Collaboration Network Analyzer

        </a>

        <a href="../dashboard.html"
           class="btn btn-light">

            Dashboard

        </a>

    </div>

</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>

            Publication Management

        </h2>

        <button
                class="btn btn-success"
                data-bs-toggle="modal"
                data-bs-target="#publicationModal">

            <i class="bi bi-plus-circle"></i>

            Add Publication

        </button>

    </div>

    <div class="table-container">

        <table class="table table-bordered table-hover">

            <thead>

            <tr>

                <th>ID</th>

                <th>Title</th>

                <th>Type</th>

                <th>Status</th>

                <th>DOI</th>

                <th>Institution</th>

                <th width="260">

                    Actions

                </th>

            </tr>

            </thead>

            <tbody id="publicationTable">

            </tbody>

        </table>

    </div>

</div>

<!-- Modal -->

<div class="modal fade"
     id="publicationModal">

    <div class="modal-dialog modal-xl">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    Publication

                </h5>

                <button class="btn-close"
                        data-bs-dismiss="modal">

                </button>

            </div>

            <div class="modal-body">

                <form id="publicationForm">

                    <input
                            type="hidden"
                            id="publicationId">

                    <div class="mb-3">

                        <label>

                            Title

                        </label>

                        <input
                                type="text"
                                id="title"
                                class="form-control"
                                required>

                    </div>

                    <div class="mb-3">

                        <label>

                            Abstract

                        </label>

                        <textarea
                                id="abstract"
                                class="form-control"
                                rows="4">

                        </textarea>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>

                                Publication Type

                            </label>

                            <select
                                    id="publication_type"
                                    class="form-select">

                                <option value="Journal Paper">

                                    Journal Paper

                                </option>

                                <option value="Conference Paper">

                                    Conference Paper

                                </option>

                                <option value="Book">

                                    Book

                                </option>

                                <option value="Patent">

                                    Patent

                                </option>

                                <option value="Technical Report">

                                    Technical Report

                                </option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>

                                Status

                            </label>

                            <select
                                    id="status"
                                    class="form-select">

                                <option value="draft">

                                    Draft

                                </option>

                                <option value="submitted">

                                    Submitted

                                </option>

                                <option value="published">

                                    Published

                                </option>

                                <option value="archived">

                                    Archived

                                </option>

                            </select>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>

                                DOI

                            </label>

                            <input
                                    type="text"
                                    id="doi"
                                    class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>

                                Institution ID

                            </label>

                            <input
                                    type="number"
                                    id="institution_id"
                                    class="form-control">

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>

                                Publication Date

                            </label>

                            <input
                                    type="date"
                                    id="publication_date"
                                    class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>

                                Journal / Venue

                            </label>

                            <input
                                    type="text"
                                    id="journal_or_venue"
                                    class="form-control">

                        </div>

                    </div>

                    <button
                            class="btn btn-primary"
                            type="submit">

                        Save Publication

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/layout.js"></script>

<script src="../js/api.js"></script>

<script src="../js/publications.js"></script>

</body>

</html>
