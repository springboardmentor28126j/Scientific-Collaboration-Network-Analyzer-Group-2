<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | Scientific Collaboration Network Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <nav class="navbar app-navbar navbar-dark"><div class="container-fluid"><span class="navbar-brand fw-bold"><i class="bi bi-file-earmark-bar-graph"></i> Institution Reports</span></div></nav>
  <main class="page-container"><div class="row justify-content-center"><div class="col-xl-9"><div class="custom-card p-4"><div class="d-flex align-items-center gap-3 mb-4"><div class="icon-box bg-primary-subtle"><i class="bi bi-building text-primary"></i></div><div><h2 class="h4 mb-1">Institution Research Report</h2><p class="text-muted mb-0">View researcher and publication totals for one institution.</p></div></div><div class="row g-2"><div class="col-md-8"><label class="form-label">Institution ID</label><input type="number" id="institutionId" class="form-control" placeholder="For example: 1"></div><div class="col-md-4 d-grid align-self-end"><button class="btn btn-primary" onclick="loadReport()"><i class="bi bi-file-earmark-text"></i> Generate Report</button></div></div></div><div class="custom-card p-4 mt-4"><h3 class="h5">Report Result</h3><div id="reportResult" class="text-muted py-4">Enter an institution ID and generate a report.</div></div><div class="custom-card p-4 mt-4"><div class="d-flex justify-content-between align-items-center"><h3 class="h5 mb-0">Generated Reports</h3><button class="btn btn-outline-secondary btn-sm" onclick="clearHistory()">Clear history</button></div><div class="table-responsive mt-3"><table class="table align-middle"><thead><tr><th>Institution ID</th><th>Researchers</th><th>Publications</th><th>Generated</th><th></th></tr></thead><tbody id="reportHistory"></tbody></table></div></div></div></div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    const historyKey = "scnaInstitutionReports";
    const institutionInput = document.getElementById("institutionId");
    const resultElement = document.getElementById("reportResult");
    const historyElement = document.getElementById("reportHistory");

    function getHistory() {
      try { return JSON.parse(localStorage.getItem(historyKey) || "[]"); }
      catch { return []; }
    }

    function renderHistory() {
      const rows = getHistory();
      historyElement.innerHTML = rows.length
        ? rows.map((item, index) => `<tr><td>${item.institution_id}</td><td>${item.researchers}</td><td>${item.publications}</td><td>${item.generated_at}</td><td><button type="button" class="btn btn-sm btn-outline-primary view-report" data-index="${index}"><i class="bi bi-eye"></i> View</button></td></tr>`).join("")
        : '<tr><td colspan="5" class="text-center text-muted">No reports generated yet.</td></tr>';

      historyElement.querySelectorAll(".view-report").forEach(button => {
        button.addEventListener("click", () => showSaved(Number(button.dataset.index)));
      });
    }

    function showSaved(index) {
      const item = getHistory()[index];
      if (!item) return;
      institutionInput.value = item.institution_id;
      resultElement.innerHTML = `<div class="d-flex justify-content-between align-items-center mb-3"><strong>Saved report</strong><small class="text-muted">Generated ${item.generated_at}</small></div><div class="row g-3"><div class="col-md-4"><div class="p-3 bg-light rounded"><small>Institution ID</small><div class="fs-3 fw-bold">${item.institution_id}</div></div></div><div class="col-md-4"><div class="p-3 bg-light rounded"><small>Researchers</small><div class="fs-3 fw-bold text-primary">${item.researchers}</div></div></div><div class="col-md-4"><div class="p-3 bg-light rounded"><small>Publications</small><div class="fs-3 fw-bold text-success">${item.publications}</div></div></div></div>`;
      resultElement.closest(".custom-card").scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function clearHistory() { localStorage.removeItem(historyKey); renderHistory(); }
    async function loadReport(){
      const id=institutionInput.value;
      const result=resultElement;
      if(!id){result.innerHTML='<div class="alert alert-warning mb-0">Enter an institution ID first.</div>';return;}
      result.innerHTML='Loading report…';
      try{const response=await fetch(`http://127.0.0.1:8000/institutions/${id}/report`);const data=await response.json();if(!response.ok){result.innerHTML=`<div class="alert alert-danger mb-0">${data.detail||"Unable to generate report."}</div>`;return;}const history=getHistory().filter(item=>item.institution_id!==data.institution_id);history.unshift({...data,generated_at:new Date().toLocaleString()});localStorage.setItem(historyKey,JSON.stringify(history.slice(0,10)));renderHistory();showSaved(0);}catch(error){result.innerHTML='<div class="alert alert-danger mb-0">Unable to connect to the server.</div>';}}
    renderHistory();
  </script>
</body>
</html>
