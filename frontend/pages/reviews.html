<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Workspace | SCNA</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css"></head>
<body><nav class="navbar app-navbar navbar-dark"><div class="container-fluid"><a class="navbar-brand fw-bold" href="../dashboard.html">Scientific Collaboration Network Analyzer</a></div></nav><main class="page-container"><div class="d-flex justify-content-between align-items-start mb-4"><div><h1 class="h2 fw-bold mb-1">Review workspace</h1><p class="text-muted mb-0">Review assigned publications, record a decision, and keep a clear decision history.</p></div><button id="assignButton" class="btn btn-primary d-none" data-bs-toggle="modal" data-bs-target="#assignModal"><i class="bi bi-person-plus"></i> Assign reviewer</button></div><div id="message"></div><section class="row g-3 mb-4" id="reviewStats"></section><div class="custom-card p-4"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Publication</th><th>Reviewer</th><th>Due date</th><th>Status</th><th>Comments</th><th class="text-end">Action</th></tr></thead><tbody id="reviewRows"><tr><td colspan="6" class="text-center text-muted">Loading reviews...</td></tr></tbody></table></div></div></main><div class="modal fade" id="assignModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="assignForm"><div class="modal-header"><h2 class="modal-title fs-5">Assign reviewer</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Publication</label><select id="publication" class="form-select mb-3" required></select><label class="form-label">Reviewer</label><select id="reviewer" class="form-select mb-3" required></select><label class="form-label">Due date</label><input id="dueDate" type="date" class="form-control"></div><div class="modal-footer"><button class="btn btn-primary">Assign review</button></div></form></div></div><div class="modal fade" id="decisionModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="decisionForm"><div class="modal-header"><h2 class="modal-title fs-5">Complete review</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="reviewId" type="hidden"><label class="form-label">Decision</label><select id="decision" class="form-select mb-3"><option value="approved">Approve</option><option value="changes_requested">Request changes</option><option value="rejected">Reject</option></select><label class="form-label">Reviewer comments</label><textarea id="comments" class="form-control" rows="5" minlength="3" required></textarea></div><div class="modal-footer"><button class="btn btn-primary">Save decision</button></div></form></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/layout.js"></script><script>
const api='http://127.0.0.1:8000',headers={'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('token')},role=(localStorage.getItem('role')||'').toLowerCase(),rows=document.getElementById('reviewRows'),message=document.getElementById('message'),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const canAssign=['admin','system admin','institution admin','publisher'].includes(role);let reviews=[];const decisionModal=new bootstrap.Modal('#decisionModal');if(canAssign)assignButton.classList.remove('d-none');function setMessage(ok,text){message.innerHTML=`<div class="alert ${ok?'alert-success':'alert-danger'}">${esc(text)}</div>`}function statusLabel(status){return `<span class="badge text-bg-${status==='approved'?'success':status==='rejected'?'danger':status==='changes_requested'?'warning':'secondary'}">${esc(status.replaceAll('_',' '))}</span>`}async function load(){const response=await fetch(api+'/reviews/',{headers});if(!response.ok){rows.innerHTML='<tr><td colspan="6" class="text-center text-danger">Unable to load reviews.</td></tr>';return}reviews=await response.json();const pending=reviews.filter(x=>x.status==='pending').length,complete=reviews.filter(x=>x.status!=='pending').length,overdue=reviews.filter(x=>x.status==='pending'&&x.due_date&&new Date(x.due_date)<new Date()).length;reviewStats.innerHTML=[['Pending',pending,'text-warning'],['Completed',complete,'text-success'],['Overdue',overdue,'text-danger']].map(([label,value,color])=>`<div class="col-md-4"><div class="custom-card p-3"><small class="text-muted">${label}</small><div class="fs-3 fw-bold ${color}">${value}</div></div></div>`).join('');rows.innerHTML=reviews.length?reviews.map(x=>`<tr><td><strong>${esc(x.publication_title)}</strong><small class="d-block text-muted">${esc(x.publication_status||'')}</small></td><td>${esc(x.reviewer_name)}</td><td>${x.due_date?esc(x.due_date):'—'}</td><td>${statusLabel(x.status)}</td><td class="text-muted">${esc(x.comments||'No decision yet')}</td><td class="text-end">${role==='reviewer'&&x.status==='pending'?`<button class="btn btn-sm btn-primary" onclick="openDecision(${x.id})">Review</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="6" class="text-center text-muted">No review assignments yet.</td></tr>'}async function setupAssign(){if(!canAssign)return;const [p,u]=await Promise.all([fetch(api+'/publications/',{headers}),fetch(api+'/users/accounts',{headers})]);if(!p.ok||!u.ok)return;publication.innerHTML=(await p.json()).map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');reviewer.innerHTML=(await u.json()).filter(x=>x.role.toLowerCase()==='reviewer'&&x.account_status==='active').map(x=>`<option value="${x.id}">${esc(x.name)} (${esc(x.email)})</option>`).join('')}function openDecision(id){reviewId.value=id;comments.value='';decisionModal.show()}assignForm.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch(api+'/reviews/assign',{method:'POST',headers,body:JSON.stringify({publication_id:Number(publication.value),reviewer_id:Number(reviewer.value),due_date:dueDate.value||null})}),d=await r.json();setMessage(r.ok,r.ok?'Reviewer assigned.':(d.detail||'Assignment failed'));if(r.ok){bootstrap.Modal.getInstance(document.getElementById('assignModal')).hide();load()}});decisionForm.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch(`${api}/reviews/${reviewId.value}/decision`,{method:'POST',headers,body:JSON.stringify({decision:decision.value,comments:comments.value})}),d=await r.json();setMessage(r.ok,r.ok?'Review decision saved.':(d.detail||'Decision failed'));if(r.ok){decisionModal.hide();load()}});load();setupAssign();
</script></body></html>
