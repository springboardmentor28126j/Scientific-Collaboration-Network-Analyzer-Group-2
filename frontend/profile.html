<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Scientific Collaboration Network Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/components.css">
</head>
<body>
  <nav class="navbar app-navbar navbar-dark"><div class="container-fluid"><a class="navbar-brand fw-bold" href="dashboard.html">Scientific Collaboration Network Analyzer</a></div></nav>
  <main class="page-container"><div class="row justify-content-center"><div class="col-lg-7"><div class="custom-card p-4"><div class="d-flex align-items-center gap-3 mb-4"><i class="bi bi-person-circle display-3 text-primary"></i><div><h2 class="mb-0">My Profile</h2><p class="text-muted mb-0">Account and access details</p></div></div><div id="profileContent" class="text-muted">Loading profile…</div></div></div></div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/layout.js"></script>
  <script>
    async function loadProfile(){
      const token=localStorage.getItem("token");
      if(!token){profileContent.innerHTML='<div class="alert alert-warning">Please sign in again to view your profile.</div>';return;}
      const response=await fetch("http://127.0.0.1:8000/users/me",{headers:{Authorization:"Bearer "+token}});
      const data=await response.json();
      if(!response.ok){profileContent.innerHTML=`<div class="alert alert-warning">${data.detail || "Unable to load your profile."}</div>`;return;}
      profileContent.innerHTML=`<dl class="row mb-0"><dt class="col-sm-3">Name</dt><dd class="col-sm-9">${data.name}</dd><dt class="col-sm-3">Email</dt><dd class="col-sm-9">${data.email}</dd><dt class="col-sm-3">Role</dt><dd class="col-sm-9"><span class="badge text-bg-primary">${data.role}</span></dd></dl>`;
    }
    loadProfile();
  </script>
</body>
</html>
