<!DOCTYPE html>
<html lang="en">


<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Scientific Collaboration Network Analyzer | Register
</title>



<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


<link rel="stylesheet" href="css/main.css">

<link rel="stylesheet" href="css/auth.css">



</head>



<body class="login-body">


<div class="container">


<div class="row justify-content-center align-items-center min-vh-100">


<div class="col-lg-6 col-md-8">


<div class="login-card">


<div class="text-center mb-4">


<i class="bi bi-person-plus-fill display-4 text-success"></i>


<h2 class="fw-bold mt-3">

Create Account

</h2>


<p class="text-muted">

Join Scientific Collaboration Network

</p>


</div>




<div id="registerMessage"
class="alert d-none">
</div>




<form id="registerForm">


<div class="mb-3">


<label class="form-label">

Full Name

</label>


<input

type="text"

id="name"

class="form-control"

placeholder="Enter full name"

required>



</div>



<div class="mb-3">


<label class="form-label">

Email

</label>


<input

type="email"

id="registerEmail"

class="form-control"

placeholder="Enter email"

required>


</div>



<div class="mb-3">


<label class="form-label">

Password

</label>


<input

type="password"

id="registerPassword"

class="form-control"

placeholder="Create password"

required>

<div class="form-text">Use 8+ characters with uppercase, lowercase, number, and special character.</div>

</div>


<div class="mb-3">

<label class="form-label">Confirm Password</label>

<input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required>

<div id="passwordFeedback" class="form-text"></div>


</div>




<div class="mb-4">


<label class="form-label">

Role

</label>


<select

id="role"

class="form-select"

required>


<option value="Researcher">

Researcher

</option>

<option value="Institution Admin">

Institution Admin (approval required)

</option>

<option value="Publisher">

Publisher (approval required)

</option>

<option value="Reviewer">

Reviewer (approval required)

</option>


</select>


</div>




<button

class="btn btn-success btn-lg w-100"

type="submit">


<i class="bi bi-person-check"></i>

Register


</button>



</form>




<hr>



<div class="text-center">


Already have an account?


<a href="index.html"
class="fw-bold">

Login

</a>



</div>



</div>


</div>


</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script src="js/api.js"></script>


<script src="js/pages/auth.js"></script>



</body>


</html>
