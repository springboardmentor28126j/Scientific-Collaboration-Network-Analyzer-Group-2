{#
  Dashboard icon set. Simple stroke-based outline icons (no fill), so a
  single `color:` on the wrapping element controls the icon color. One
  dispatcher macro keeps call sites short: {{ dicons.icon('publication') }}.
#}
{% macro icon(name, size=20) %}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="dash-icon" aria-hidden="true">
{%- if name == 'home' %}
  <path d="M4 11.5 12 4l8 7.5"/>
  <path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/>
{%- elif name == 'bar-chart' %}
  <rect x="5" y="14" width="3" height="6" rx="0.5"/>
  <rect x="10.5" y="10" width="3" height="10" rx="0.5"/>
  <rect x="16" y="6" width="3" height="14" rx="0.5"/>
{%- elif name == 'network' %}
  <circle cx="6" cy="6" r="2.2"/>
  <circle cx="18" cy="6" r="2.2"/>
  <circle cx="12" cy="18" r="2.2"/>
  <path d="M7.8 7.3 10.5 16M16.2 7.3 13.5 16M8.2 6h7.6"/>
{%- elif name == 'publication' %}
  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
  <path d="M14 2v6h6"/>
  <line x1="8" y1="13" x2="16" y2="13"/>
  <line x1="8" y1="17" x2="13.5" y2="17"/>
{%- elif name == 'conference' %}
  <rect x="3" y="4" width="18" height="18" rx="2"/>
  <line x1="16" y1="2" x2="16" y2="6"/>
  <line x1="8" y1="2" x2="8" y2="6"/>
  <line x1="3" y1="10" x2="21" y2="10"/>
  <path d="M8 15l2 2 4-4"/>
{%- elif name == 'project' %}
  <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
{%- elif name == 'review' %}
  <path d="M9 2h6a1 1 0 0 1 1 1v2H8V3a1 1 0 0 1 1-1z"/>
  <rect x="5" y="4" width="14" height="18" rx="2"/>
  <path d="M9 13.5l2 2 4-4.5"/>
{%- elif name == 'institution' %}
  <path d="M3 21h18"/>
  <path d="M5 21V10M9.5 21V10M14.5 21V10M19 21V10"/>
  <path d="M2 10l10-6 10 6"/>
{%- elif name == 'researcher' %}
  <circle cx="12" cy="8" r="4"/>
  <path d="M4 21c0-4.4 3.6-6.5 8-6.5s8 2.1 8 6.5"/>
{%- elif name == 'users' %}
  <circle cx="8.5" cy="8" r="3.3"/>
  <circle cx="16.2" cy="9.2" r="2.5"/>
  <path d="M2.2 20.2c0-3.7 2.9-6.1 6.3-6.1s6.3 2.4 6.3 6.1"/>
  <path d="M15.3 14.6c2.4.5 4.5 2.3 4.5 5.6"/>
{%- elif name == 'trophy' %}
  <path d="M8 21h8"/>
  <path d="M12 17v4"/>
  <path d="M7 4h10v5a5 5 0 0 1-10 0z"/>
  <path d="M7 5H4.5a2.5 2.5 0 0 0 2.5 4.3"/>
  <path d="M17 5h2.5A2.5 2.5 0 0 1 17 9.3"/>
{%- elif name == 'department' %}
  <rect x="3" y="3" width="7.5" height="7.5" rx="1"/>
  <rect x="13.5" y="3" width="7.5" height="7.5" rx="1"/>
  <rect x="3" y="13.5" width="7.5" height="7.5" rx="1"/>
  <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1"/>
{%- elif name == 'audit' %}
  <polyline points="3,12 7.5,12 9.5,6 13.5,18 15.5,12 21,12"/>
{%- elif name == 'settings' %}
  <circle cx="12" cy="12" r="3.2"/>
  <path d="M12 2.5v3.2M12 18.3v3.2M4.9 4.9l2.3 2.3M16.8 16.8l2.3 2.3M2.5 12h3.2M18.3 12h3.2M4.9 19.1l2.3-2.3M16.8 7.2l2.3-2.3"/>
{%- elif name == 'bell' %}
  <path d="M6 8.5a6 6 0 0 1 12 0c0 4.7 1.8 5.8 1.8 5.8H4.2S6 13.2 6 8.5z"/>
  <path d="M10.2 19.5a2 2 0 0 0 3.6 0"/>
{%- elif name == 'clock' %}
  <circle cx="12" cy="12" r="9"/>
  <path d="M12 7v5l3.3 1.9"/>
{%- elif name == 'trending-up' %}
  <polyline points="3,17 9.5,10.5 13.5,14.5 21,6.5"/>
  <polyline points="14.5,6.5 21,6.5 21,13"/>
{%- elif name == 'arrow-right' %}
  <line x1="4" y1="12" x2="19" y2="12"/>
  <polyline points="12.5,5.5 19,12 12.5,18.5"/>
{%- elif name == 'chevron-right' %}
  <polyline points="9,5 15.5,12 9,19"/>
{%- elif name == 'check-circle' %}
  <circle cx="12" cy="12" r="9"/>
  <polyline points="7.8,12.3 10.5,15 16.3,8.8"/>
{%- elif name == 'alert' %}
  <path d="M12 3 22 20H2z" stroke-linejoin="round"/>
  <line x1="12" y1="9.5" x2="12" y2="14.3"/>
  <line x1="12" y1="17.2" x2="12" y2="17.4"/>
{%- elif name == 'building' %}
  <rect x="5" y="2.5" width="14" height="19" rx="1"/>
  <line x1="9" y1="7" x2="9" y2="7.01"/>
  <line x1="15" y1="7" x2="15" y2="7.01"/>
  <line x1="9" y1="11" x2="9" y2="11.01"/>
  <line x1="15" y1="11" x2="15" y2="11.01"/>
  <line x1="9" y1="21.5" x2="9" y2="17.5"/>
  <line x1="15" y1="21.5" x2="15" y2="17.5"/>
{%- elif name == 'compass' %}
  <circle cx="12" cy="12" r="9.2"/>
  <polygon points="15.5,8.5 13.2,13.2 8.5,15.5 10.8,10.8"/>
{%- elif name == 'inbox' %}
  <path d="M3.5 12.5h5l1.7 2.7h3.6l1.7-2.7h5"/>
  <path d="M5 5.5h14l2 7v6a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5v-6z"/>
{%- else %}
  <circle cx="12" cy="12" r="9"/>
{%- endif %}
</svg>
{%- endmacro %}
