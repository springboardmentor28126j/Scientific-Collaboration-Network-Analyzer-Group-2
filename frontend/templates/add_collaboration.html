<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Collaboration - Scientific Collaboration Network Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="topbar">
        <a href="{{ url_for('home') }}" class="logo" style="text-decoration: none; color: inherit;">🔬 SciCollab</a>
    </div>

    <div class="center-wrapper">
        <div class="card">
            <div class="subtitle">New entry</div>
            <div class="title">Add Collaboration</div>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_collaboration') }}">
                <div class="form-group">
                    <input type="text" name="project_name" placeholder="Project name" required>
                </div>

                <div class="form-group">
                    <input type="text" name="institution_a" placeholder="Institution A">
                </div>

                <div class="form-group">
                    <input type="text" name="institution_b" placeholder="Institution B">
                </div>

                <div class="form-group">
                    <input type="text" name="description" placeholder="Description (optional)">
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 8px;">Save Collaboration</button>
            </form>

            <div class="bottom-text">
                <a href="{{ url_for('collaborations') }}" class="link">Back to Collaborations</a>
            </div>
        </div>
    </div>

</body>
</html>
