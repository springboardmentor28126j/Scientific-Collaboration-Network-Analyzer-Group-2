<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Conference - Scientific Collaboration Network Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="topbar">
        <a href="{{ url_for('home') }}" class="logo" style="text-decoration: none; color: inherit;">🔬 SciCollab</a>
    </div>

    <div class="center-wrapper">
        <div class="card">
            <div class="subtitle">New entry</div>
            <div class="title">Add Conference</div>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_conference') }}">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Conference name" required>
                </div>

                <div class="form-group">
                    <input type="text" name="location" placeholder="Location">
                </div>

                <div class="form-group">
                    <input type="date" name="start_date">
                </div>

                <div class="form-group">
                    <input type="date" name="end_date">
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 8px;">Save Conference</button>
            </form>

            <div class="bottom-text">
                <a href="{{ url_for('conferences') }}" class="link">Back to Conferences</a>
            </div>
        </div>
    </div>

</body>
</html>
