<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Institution - Scientific Collaboration Network Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="topbar">
        <a href="{{ url_for('home') }}" class="logo" style="text-decoration: none; color: inherit;">🔬 SciCollab</a>
    </div>

    <div class="center-wrapper">
        <div class="card">
            <div class="subtitle">New entry</div>
            <div class="title">Add Institution</div>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_institution') }}">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Institution name" required>
                </div>

                <div class="form-group">
                    <input type="text" name="type" placeholder="Type (e.g. University, Research Lab)">
                </div>

                <div class="form-group">
                    <input type="text" name="location" placeholder="Location">
                </div>

                <div class="form-group">
                    <input type="text" name="website" placeholder="Website (optional)">
                </div>

                <div class="form-group">
                    <input type="text" name="description" placeholder="Short description (optional)">
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 8px;">Save Institution</button>
            </form>

            <div class="bottom-text">
                <a href="{{ url_for('institutions') }}" class="link">Back to Institutions</a>
            </div>
        </div>
    </div>

</body>
</html>
