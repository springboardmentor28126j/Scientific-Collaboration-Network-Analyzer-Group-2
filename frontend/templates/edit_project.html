{% extends "base.html" %}
{% block title %}Edit Project{% endblock %}
{% block content %}
<h1>Edit Project</h1>

<form method="post" class="card-form">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ project.title }}" required>

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="4">{{ project.description or "" }}</textarea>

    <label for="status">Status</label>
    <select id="status" name="status" required>
        {% for s in ["planned", "ongoing", "completed", "cancelled"] %}
        <option value="{{ s }}" {% if project.status == s %}selected{% endif %}>{{ s | capitalize }}</option>
        {% endfor %}
    </select>

    <label for="start_date">Start date</label>
    <input type="date" id="start_date" name="start_date" value="{{ project.start_date or '' }}">

    <label for="end_date">End date</label>
    <input type="date" id="end_date" name="end_date" value="{{ project.end_date or '' }}">

    <button type="submit" class="primary">Save changes</button>
</form>
{% endblock %}
