{% extends "base.html" %}
{% block title %}Forgot Password — SCNA{% endblock %}
{% block content %}
<div class="container">
  <h1>Forgot your password?</h1>
  <p class="section-sub">Enter your account email and we'll send you a reset link.</p>
  <form method="POST">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    <button type="submit" class="btn-inline btn-purple" style="margin-top:12px;">Send reset link</button>
  </form>
  <span class="muted-link"><a href="{{ url_for('login') }}">Back to login</a></span>
</div>
{% endblock %}
