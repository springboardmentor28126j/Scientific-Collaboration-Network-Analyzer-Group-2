{% extends "base.html" %}
{% block title %}Forgot Password — SCNA{% endblock %}
{% block content %}
<div class="container">
  <h1>Forgot your password?</h1>
  <p class="section-sub">Enter your account email and we'll send you a reset link.</p>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    <input type="text" name="website" style="position:absolute; left:-9999px;" tabindex="-1" autocomplete="off">
    <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}" style="margin:14px 0;"></div>
    <button type="submit" class="btn-inline btn-purple" style="margin-top:12px;">Send reset link</button>
  </form>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <span class="muted-link"><a href="{{ url_for('login') }}">Back to login</a></span>
</div>
{% endblock %}
