{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block auth_content %}
<a class="login-back-link" href="{{ url_for('login') }}">&larr; Back to login</a>
<h1>Forgot your password?</h1>
<p>Enter the email address on your account and we'll send you a link to reset your password.</p>
<form method="post" class="card-form">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>

    <button type="submit" class="primary">Send reset link</button>
</form>
{% endblock %}
