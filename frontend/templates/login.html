{% extends "base.html" %}
{% block title %}Login — SCNA{% endblock %}
{% block content %}
<div class="container">
  <h1>Login</h1>
  <form method="POST" action="{{ url_for('login') }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required value="{{ unverified_email or '' }}">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <button type="submit">Log in</button>
  </form>

  <div style="text-align:center; margin:16px 0; color:var(--muted); font-size:13px;">or</div>

  <div id="g_id_onload" data-client_id="{{ google_client_id }}" data-callback="handleGoogleSignIn" data-auto_prompt="false"></div>
  <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large" data-width="320"></div>

  <span class="muted-link"><a href="{{ url_for('forgot_password') }}">Forgot your password?</a></span><br>
  <span class="muted-link">No account? <a href="{{ url_for('register') }}">Register here</a></span>

  {% if unverified_email %}
  <div class="empty-state" style="margin-top:16px;">
    <p>Your email isn't verified yet.</p>
    <form method="POST" action="{{ url_for('resend_verification') }}">
      <input type="hidden" name="email" value="{{ unverified_email }}">
      <button type="submit" class="btn-inline btn-purple">Resend verification email</button>
    </form>
  </div>
  {% endif %}
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  function handleGoogleSignIn(response) {
    const form = document.createElement("form");
    form.method = "POST";
    form.action = "{{ url_for('auth_google') }}";
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = "credential";
    input.value = response.credential;
    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
  }
</script>
{% endblock %}
