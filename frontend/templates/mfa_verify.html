{% extends "base.html" %}
{% block title %}Verify Code — SCNA{% endblock %}
{% block content %}
<div class="container">
  <h1>Enter your login code</h1>
  <p class="section-sub">We've emailed a 6-digit code to your address. It expires in 10 minutes.</p>
  <form method="POST">
    <label for="code">Login code</label>
    <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus>
    <button type="submit" class="btn-inline btn-purple" style="margin-top:12px; width:100%; text-align:center;">Verify</button>
  </form>
  <form method="POST" action="{{ url_for('mfa_resend') }}">
    <span class="muted-link">
      Didn't get it? <button type="submit" style="all:unset; cursor:pointer; color:var(--accent); font-weight:600;">Resend code</button>
    </span>
  </form>
  <span class="muted-link"><a href="{{ url_for('login') }}">Back to login</a></span>
</div>
{% endblock %}
