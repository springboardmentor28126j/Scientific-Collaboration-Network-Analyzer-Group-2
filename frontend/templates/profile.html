<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile - Scientific Collaboration Network Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="topbar">
        <div class="logo">🔬 SciCollab</div>
    </div>

    <div class="center-wrapper">
        <div class="card">
            <div class="subtitle">One last step</div>
            <div class="title">Complete your profile</div>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}
            {% if success %}
            <div class="alert alert-success">{{ success }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('profile') }}">
                <div class="form-group">
                    <input type="text" name="full_name" placeholder="Full name" required>
                </div>
                <div class="form-group">
                    <input type="text" name="department" placeholder="Department">
                </div>
                <div class="form-group">
                    <input type="text" name="institution" placeholder="Institution">
                </div>
                <div class="form-group">
                    <input type="text" name="interests" placeholder="Research interests">
                </div>
                <div class="form-group">
                    <input type="text" name="skills" placeholder="Skills">
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 8px;">Save profile</button>
            </form>

            <div class="bottom-text">
                <a href="{{ url_for('logout') }}" class="link">Logout</a>
            </div>
        </div>
    </div>

</body>
</html>
