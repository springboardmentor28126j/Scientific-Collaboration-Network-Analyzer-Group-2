{% extends "base.html" %}
{% block title %}Register — SCNA{% endblock %}
{% block content %}
<div class="container">
  <h1>Create your researcher account</h1>
  <form method="POST" action="{{ url_for('register') }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="8">

    <button type="submit">Create account</button>
  </form>
  <span class="muted-link">Already have an account? <a href="{{ url_for('login') }}">Login</a></span>
  <p class="muted-link" style="margin-top:8px;">
    New accounts are created as Researcher. Institution Admin, Reviewer, and
    System Admin access is granted by an administrator.
  </p>
</div>
{% endblock %}
