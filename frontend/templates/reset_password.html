{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block auth_content %}
<a class="login-back-link" href="{{ url_for('login') }}">&larr; Back to login</a>
<h1>Choose a new password</h1>
<form method="post" class="card-form">
    <input type="hidden" name="token" value="{{ token }}">

    <label for="new_password">New password</label>
    <input type="password" id="new_password" name="new_password" minlength="8" required autofocus>

    <label for="confirm_password">Confirm new password</label>
    <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>

    <button type="submit" class="primary">Reset password</button>
</form>
<p style="font-size:0.85em; color:#666;">This link expires shortly after it was requested, so if it's stopped working, go back and request a new one.</p>
{% endblock %}
