{% extends "base.html" %}
{% block title %}Reset Password — SCNA{% endblock %}
{% block content %}
<div class="container">
  <h1>Choose a new password</h1>
  <form method="POST">
    <input type="hidden" name="token" value="{{ token }}">
    <label for="password">New password</label>
    <input type="password" id="password" name="password" required minlength="8">
    <button type="submit" class="btn-inline btn-purple" style="margin-top:12px;">Reset password</button>
  </form>
</div>
{% endblock %}
